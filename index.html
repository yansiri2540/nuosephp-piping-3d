$('lg').innerHTML+=LG.map(a=>`<div><i style="background:#${a[1].toString(16).padStart(6,'0')}"></i>${a[0]}</div>`).join('')+'<small>ลูกศรขาว = ทิศทางการไหล · Resin 1-4 สีเทา ไม่แสดงการไหล</small>';
// ===== กล้อง + ลากย้ายกลุ่ม =====
const home={th:.9,ph:1.0,d:115};let th=home.th,ph=home.ph,d=home.d;const tg=new T.Vector3(3,3,-8);
function upd(){cam.position.set(tg.x+d*Math.sin(ph)*Math.sin(th),tg.y+d*Math.cos(ph),tg.z+d*Math.sin(ph)*Math.cos(th));cam.lookAt(tg)}
const ray=new T.Raycaster(),mv=new T.Vector2(),gp=new T.Plane(new T.Vector3(0,1,0),0),off=new T.Vector3();
let drag=null,ax=null,edit=true,snap=false,need=false,pd=0,tap=null;const ptr=new Map();
function setRay(e){const r=cv.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mv,cam)}
function hit(e){setRay(e);const gz=P.children.filter(m=>m.userData.axis);let h=ray.intersectObjects(gz,false)[0];if(h)return{t:'ax',a:h.object.userData.axis};
 const ms=P.children.filter(m=>m.userData.pid);for(const k in G)G[k].o.traverse(m=>{if(m.isMesh)ms.push(m)});
 h=ray.intersectObjects(ms,false)[0];if(!h)return null;const o=h.object;if(o.userData.pid)return{t:'pipe',id:o.userData.pid};
 let q=o;while(q&&!q.userData.k)q=q.parent;return q?{t:'grp',k:q.userData.k}:null}
function axT(O,D){const r=ray.ray,w=O.clone().sub(r.origin),b=D.dot(r.direction),dd=D.dot(w),ee=r.direction.dot(w),den=1-b*b;return Math.abs(den)<1e-4?null:(b*ee-dd)/den}
function save(){try{const g={};for(const k in G)g[k]=[G[k].o.position.x,G[k].o.position.z];localStorage.setItem('np3d_layout2',JSON.stringify({g,a:ADJ}))}catch(e){}}
const ginfo=()=>`${NM[drag]}  X ${G[drag].o.position.x.toFixed(1)} · Z ${G[drag].o.position.z.toFixed(1)} m`;
function showSel(){if(!SEL){$('in').textContent='ลากกลุ่มอุปกรณ์เพื่อย้าย · คลิกท่อเพื่อขยับ';return}const a=ADJ[SEL]||{},f=v=>((v||0)>=0?'+':'')+(v||0).toFixed(1);let w='';
 if(SEL==='MAIN'){const H=6+(a.y||0);if(H<5.8)w=' ⚠ ต่ำกว่าปากถัง Recycle 2 ไหลตามแรงโน้มถ่วงไม่ได้';else if(H>6.8)w=' ⚠ สูงกว่าปากท่อขาออก Resin 5 (6.8 m) ไหลตามแรงโน้มถ่วงไม่ได้'}
 $('in').textContent=`ท่อ: ${NAMEP[SEL]} · X ${f(a.x)} Y ${f(a.y)} Z ${f(a.z)} m${w}`}
cv.addEventListener('pointerdown',e=>{if(edit){const h=hit(e);
  if(h&&h.t==='ax'){const hp=HND[SEL],O=new T.Vector3(hp[0],hp[2],hp[1]),D=AXD[h.a],t0=axT(O,D);if(t0!==null){ax={a:h.a,O,D,t0,p0:(ADJ[SEL]&&ADJ[SEL][h.a])||0};cv.setPointerCapture(e.pointerId);return}}
  if(h&&h.t==='grp'){drag=h.k;const p=new T.Vector3();ray.ray.intersectPlane(gp,p);off.copy(p).sub(G[drag].o.position);cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';$('in').textContent=ginfo();return}
  if(h&&h.t==='pipe'){SEL=h.id;need=true;showSel();return}
  tap=[e.clientX,e.clientY]}
 cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY])});
function end(e){if(ax){save();ax=null;return}if(drag){save();drag=null;cv.style.cursor='default';return}
 if(tap&&SEL&&Math.hypot(e.clientX-tap[0],e.clientY-tap[1])<4){SEL=null;need=true;showSel()}tap=null;ptr.delete(e.pointerId);pd=0}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
cv.addEventListener('pointermove',e=>{
 if(ax){setRay(e);const t=axT(ax.O,ax.D);if(t===null)return;let v=ax.p0+t-ax.t0;if(snap)v=Math.round(v*2)/2;(ADJ[SEL]=ADJ[SEL]||{})[ax.a]=v;need=true;showSel();return}
 if(drag){setRay(e);const p=new T.Vector3();if(!ray.ray.intersectPlane(gp,p))return;let x=p.x-off.x,z=p.z-off.z;if(snap){x=Math.round(x*2)/2;z=Math.round(z*2)/2}
  G[drag].o.position.set(x,0,z);need=true;$('in').textContent=ginfo();return}
 if(!ptr.has(e.pointerId)){if(edit){const h=hit(e);cv.style.cursor=h?(h.t==='ax'?'pointer':'grab'):'default';
   if(!SEL)$('in').textContent=!h?'ลากกลุ่มอุปกรณ์เพื่อย้าย · คลิกท่อเพื่อขยับ':h.t==='grp'?NM[h.k]+' (ลากเพื่อย้าย)':h.t==='pipe'?'ท่อ: '+NAMEP[h.id]+' (คลิกเพื่อเลือก)':''}return}
 const o=ptr.get(e.pointerId);
 if(ptr.size===1){th-=(e.clientX-o[0])*.006;ph=Math.min(1.5,Math.max(.15,ph-(e.clientY-o[1])*.006))}
 else if(ptr.size===2){const v=[...ptr.entries()].map(([k,p])=>k===e.pointerId?[e.clientX,e.clientY]:p);const nd=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]);if(pd)d=Math.min(180,Math.max(10,d*pd/nd));pd=nd}
 ptr.set(e.pointerId,[e.clientX,e.clientY])});
cv.addEventListener('wheel',e=>{e.preventDefault();d=Math.min(180,Math.max(10,d*(1+e.deltaY*.001)))},{passive:false});

$('ed').onclick=e=>{edit=!edit;e.target.classList.toggle('on',edit);e.target.textContent='โหมดย้าย: '+(edit?'เปิด':'ปิด')};
$('sn').onclick=e=>{snap=!snap;e.target.classList.toggle('on',snap);e.target.textContent='Snap 0.5 m: '+(snap?'เปิด':'ปิด')};
$('rl').onclick=()=>{for(const k in DEF)G[k].o.position.set(DEF[k][0],0,DEF[k][1]);for(const k in ADJ)delete ADJ[k];SEL=null;save();need=true;showSel()};
$('rp').onclick=()=>{if(SEL){delete ADJ[SEL];save();need=true;showSel()}};

const up=new T.Vector3(0,1,0);let last=performance.now();
(function loop(t){const dt=(t-last)/1000;last=t;if(need){buildPipes();need=false}
 for(const f of FL){if(run)f.o=(f.o+5*dt/f.tot)%1;let s=f.o*f.tot,i=0;while(i<f.seg.length-1&&s>f.seg[i]){s-=f.seg[i];i++}
  const a=f.q[i],b=f.q[i+1],u=Math.min(1,s/f.seg[i]||0);f.c.position.lerpVectors(a,b,u);f.c.quaternion.setFromUnitVectors(up,b.clone().sub(a).normalize())}
 upd();RN.render(S,cam);requestAnimationFrame(loop)})(last);
